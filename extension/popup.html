<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Browser Bridge</title>
  <style>
    :root { color-scheme: light dark; font: 13px/1.55 system-ui, sans-serif; }
    body { margin: 0; width: 340px; color: #172033; background: #f7f9fc; }
    main { padding: 22px; }
    h1 { margin: 0; font-size: 22px; letter-spacing: -.5px; }
    p { margin: 6px 0 16px; }
    .muted { color: #64748b; font-size: 12px; }
    .status { border: 1px solid #d9e1ec; border-radius: 10px; padding: 12px; background: #fff; margin-bottom: 18px; overflow-wrap: anywhere; }
    .status strong { display: block; color: #475569; margin-bottom: 5px; }
    .status.online strong { color: #15803d; }
    .status p { margin: 0; }
    label { display: block; font-weight: 600; margin: 12px 0 5px; }
    input, button { box-sizing: border-box; width: 100%; border: 1px solid #cbd5e1; border-radius: 7px; font: inherit; padding: 9px 10px; }
    input { background: #fff; color: #172033; }
    button { cursor: pointer; margin-top: 12px; background: #2563eb; border-color: #2563eb; color: #fff; font-weight: 600; }
    button.secondary { background: #fff; border-color: #cbd5e1; color: #334155; }
    button:disabled { opacity: .55; cursor: wait; }
    #message { color: #b91c1c; margin-top: 12px; overflow-wrap: anywhere; }
    #sessionList { padding-left: 18px; max-height: 135px; overflow: auto; }
    details { margin-top: 16px; }
    code { font: 11px/1.5 ui-monospace, monospace; overflow-wrap: anywhere; }
    @media (prefers-color-scheme: dark) {
      body { background: #111827; color: #e2e8f0; }
      .status, input, button.secondary { background: #1e293b; color: #e2e8f0; border-color: #475569; }
      .muted { color: #94a3b8; }
      .status strong { color: #cbd5e1; }
      .status.online strong { color: #4ade80; }
      #message { color: #fca5a5; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Browser Bridge</h1>
    <p class="muted">DSH · Antigravity · Microsoft Edge</p>
    <section id="statusBox" class="status" aria-live="polite">
      <strong id="state">正在读取状态…</strong>
      <p id="description" class="muted"></p>
    </section>
    <form id="pairForm">
      <label for="port">本地服务端口</label>
      <input id="port" type="number" min="1024" max="65535" value="9224" required>
      <label for="token">配对令牌</label>
      <input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="粘贴本地 bridge 提供的令牌">
      <p id="pairHint" class="muted">令牌保存在当前浏览器 profile 中，不会显示在状态信息里。</p>
      <button id="connect" type="submit">保存并连接</button>
    </form>
    <button id="release" class="secondary" type="button">暂停连接并释放全部标签页</button>
    <div id="message" role="alert"></div>
    <details>
      <summary id="sessionCount">受控标签页：0</summary>
      <ul id="sessionList"></ul>
    </details>
    <details>
      <summary>浏览器实例</summary>
      <code id="instance"></code>
      <p class="muted">每个 profile 使用独立实例。释放标签页会解除调试和分组，不会关闭网页。</p>
    </details>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
